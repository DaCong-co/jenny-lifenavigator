name: Build APK

# 手动触发（Actions 页面点 "Run workflow"），或 push 到 main 自动触发。
# 产物是 release APK，用仓库 Secrets 里的固定 keystore 签名，可覆盖安装。
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # Chaquopy 首次构建要下载 Python 包 + Gradle 依赖，给足时间。
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # AGP 8.7 + Gradle 8.9 要求 JDK 17。
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy 构建需要一个与 `chaquopy.version = "3.11"` 匹配的
      # 构建主机 Python；ubuntu-latest 默认是 3.12，没有 python3.11。
      - name: Set up Python 3.11 (Chaquopy build Python)
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Ensure python3.11 is on PATH
        run: |
          ln -sf "$(command -v python3)" /usr/local/bin/python3.11
          python3.11 --version

      # ubuntu-latest ships the Android SDK, but the setup-android action is
      # pinned to the deprecated Node 20 runtime and has been failing before
      # Gradle even starts. Use the preinstalled SDK directly, and only
      # download command-line tools if the image ever stops bundling them.
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK not found at $SDK_ROOT" >&2
            exit 1
          fi
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found; installing Android command-line tools"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -o /tmp/android-cmdline-tools.zip
            unzip -q /tmp/android-cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      # Fixed release key, restored from repository secrets. Without this the
      # APK would be debug-signed with a fresh key on every runner, so no build
      # could ever update the previous one in place.
      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.JENNY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JENNY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JENNY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JENNY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "JENNY_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/jenny-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          {
            echo "JENNY_KEYSTORE_PATH=$KEYSTORE"
            echo "JENNY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "JENNY_KEY_ALIAS=$KEY_ALIAS"
            echo "JENNY_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # Explicitly install the compileSdk 34 platform and its build-tools;
      # Gradle otherwise resolves them lazily and a missing package fails
      # halfway through the build.
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jenny-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
