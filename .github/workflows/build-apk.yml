name: Build APK

# 手动触发（Actions 页面点 "Run workflow"），或 push 到 main 自动触发。
# 产物是 debug APK（未签名，可直接拖进 MuMu 模拟器安装）。
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # Chaquopy 首次构建要下载 Python 包 + Gradle 依赖，给足时间。
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 8.7 + Gradle 8.9 要求 JDK 17。
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 确保 Android SDK 存在并接受 license；缺失的 platform/build-tools
      # 由 Gradle 在构建时通过 sdkmanager 自动补齐。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jenny-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
