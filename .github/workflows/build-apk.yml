name: Build APK

# 手动触发（Actions 页面点 "Run workflow"），或 push 到 main 自动触发。
# 产物是 debug APK（未签名，可直接拖进 MuMu 模拟器安装）。
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # Chaquopy 首次构建要下载 Python 包 + Gradle 依赖，给足时间。
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # AGP 8.7 + Gradle 8.9 要求 JDK 17。
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy 构建需要一个与 `chaquopy.version = "3.11"` 匹配的
      # 构建主机 Python；ubuntu-latest 默认是 3.12，没有 python3.11。
      - name: Set up Python 3.11 (Chaquopy build Python)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure python3.11 is on PATH
        run: |
          ln -sf "$(command -v python3)" /usr/local/bin/python3.11
          python3.11 --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 显式装 compileSdk 34 对应的 platform 并接受 license。build-tools
      # 由 Gradle 在构建时按 AGP 8.7 的要求自动下载。
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" > /dev/null 2>&1 || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jenny-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
